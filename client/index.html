<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Book Inventory: browse, search and manage a book collection. A full-stack demo built with React and Django REST Framework."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400..700&display=swap"
    />
    <title>Book Inventory</title>
    <script>
      // Apply the saved or system theme before the first paint (useTheme keeps it in sync after)
      try {
        var t = localStorage.getItem("theme");
        if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
